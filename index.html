<!doctype html>
<html lang="fr">
  <head>
    <!-- Encodage et affichage -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO : référencement naturel -->
    <title>MemoRyGame - Jeu de Memory interactif</title>

    <meta
      name="description"
      content="Découvrez MemoRyGame, un jeu de Memory interactif développé en JavaScript. Retrouvez les paires, enchaînez les combos et découvrez un logo animé unique sur le dos des cartes."
    />

    <meta name="author" content="Sylvain G404" />

    <meta
      name="keywords"
      content="MemoRyGame, jeu memory, jeu de mémoire, memory game, JavaScript, HTML5, CSS3, Canvas, jeu navigateur, cartes animées, logo animé"
    />

    <meta name="robots" content="index, follow" />

    <meta name="language" content="French" />

    <!-- Identité visuelle du navigateur -->
    <meta name="theme-color" content="#111111" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Assets/Favicon/Favicon.K.sf.blanc.png" />
    <link rel="icon" type="image/x-icon" href="Assets/Favicon/Favicon.K.sf.blanc.ico" />

    <!-- Open Graph : aperçu lors du partage -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="MemoRyGame" />
    <meta property="og:title" content="MemoRyGame - Jeu de Memory interactif" />
    <meta
      property="og:description"
      content="Un jeu de Memory développé en JavaScript, avec un système de score, des combos et un logo animé temporel sur le dos des cartes."
    />
    <meta property="og:url" content="https://sylvain-g404.github.io/MemoRyGame/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MemoRyGame - Jeu de Memory interactif" />
    <meta
      name="twitter:description"
      content="Découvrez MemoRyGame : un jeu de mémoire interactif avec cartes animées et identité visuelle dynamique."
    />

    <!-- CSS -->
    <link rel="stylesheet" href="Style/style.css" />
  </head>

  <body>
    <div id="soundToggle" class="off">🔇</div>
    <h1>MemoRyGame</h1>

    <hr />
    <div id="table"></div>
    <div id="HUD">
      <div id="score">Score : 0</div>
      <div id="combo">Combo : x0</div>
    </div>
    <hr />
    <div class="MemoRyGame" id="MemoRyGame">
      <a href="https://sylvain-g404.github.io/Mon-Portfolio-Temps/" class="retour-portfolio"> ← Retour au Portfolio </a>
    </div>

    <!-- ==================================================
     1. BRIQUES DE DESSIN DU LOGO (Indépendantes)
     ================================================== -->
    <script src="JavaScript/Animation_Logo/logo_externe.js"></script>
    <script src="JavaScript/Animation_Logo/logo_interne.js"></script>
    <script src="JavaScript/Animation_Logo/logo_centre.js"></script>

    <!-- ==================================================
     2. MOTEUR DE L'ANIMATION ET CANVAS VIRTUEL
     ================================================== -->
    <!-- Initialise le canvas en mémoire -->
    <script src="JavaScript/Animation_Logo/main.js"></script>
    <!-- Gère la boucle temporelle et l'extraction toDataURL() -->
    <script src="JavaScript/Animation_Logo/logo_anime.js"></script>

    <!-- ==================================================
     3. LOGIQUE DU JEU DE CARTES MEMORY
     ================================================== -->
    <!-- Contient la classe Carte et Deck -->
    <script src="JavaScript/class.js"></script>

    <script src="JavaScript/songCarte.js"></script>
    <!-- Le chef d'orchestre : lance le jeu et l'animation au DOMContentLoaded -->
    <script src="JavaScript/main.js"></script>
  </body>
</html>
